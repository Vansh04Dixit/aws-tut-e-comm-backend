name : Node CI

on: 
  push: 
    
jobs: 
  test: 
    runs-on: ubuntu-latest
        
    steps: 
      - name: Get repo code 
        uses: actions/checkout@v4

      - name: Setup node js 
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check node version
        run:  node --version

      - name: Check syntax
        run: node --check src/index.js
        