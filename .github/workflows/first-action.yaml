name : Node CI/CD

on: 
  push: 
    branches : 
      - prasanna
    
jobs: 
  deploy: 
    runs-on: ubuntu-latest
        
    steps: 
      - name: Get repo code 
        uses: actions/checkout@v4

      - name: Setup node js 
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: find src -name "*.js" -type f -exec node --check {} \;

      - name: Run lint
        run: npm run lint

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/e-comm-tut-aws/aws-tut-e-comm-backend
            git checkout prasanna
            git pull origin prasanna
            npm ci
            pm2 restart aws-tut-e-comm-backend

      - name: Confirmation
        run: echo "All Done!!"